name: Research checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "${{ matrix.node }}"
      - run: npm test
      - run: npm run build
      - run: npm run demo
      - run: node cli/main.mjs verify runs/demo
      - uses: actions/upload-artifact@v4
        with:
          name: decision-studio-node-${{ matrix.node }}
          path: dist/
      - uses: actions/upload-artifact@v4
        with:
          name: research-bundle-node-${{ matrix.node }}
          path: runs/demo/
